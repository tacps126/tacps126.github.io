name: Refresh from Apify
# Rebuilds the site from the public Apify Store every day, so new public tools,
# price changes, run numbers and the social image follow without a manual build.
# Commits only when something changed. Reads public Store data only: no tokens.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: node build.mjs
      - name: Header names the owner
        run: grep -q "Tapaswai Choudhary (tacps126)" index.html
      - name: Commit if anything changed
        run: |
          # sitemap lastmod dates change daily on their own; ignore a change that is only that
          if git diff --quiet -- . ':!sitemap.xml'; then echo "no changes"; git checkout -- sitemap.xml; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh from the Apify Store"
          git push
