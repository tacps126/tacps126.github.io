name: Check
# Syntax-checks the generator and the page script. Offline: no tokens.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check build.mjs && node --check app.js
      - name: Header names the owner
        run: grep -q "Tapaswai Choudhary (tacps126)" index.html
      - name: No keys or tokens in the published files
        run: |
          if git grep -nIE 'apify_api_[A-Za-z0-9]{10}|gh[pousr]_[A-Za-z0-9]{20}|sk-[A-Za-z0-9_-]{20}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!.github'; then
            echo "secret-like string found"; exit 1
          fi
